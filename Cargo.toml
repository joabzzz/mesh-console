[workspace]
resolver = "2"
members = [
    "crates/console-types",
    "crates/console-core",
    "crates/console-app",
]

[workspace.package]
version = "0.2.0"
authors = ["Alessandro Joabar <ale@joabar.ai>"]
edition = "2021"

[workspace.dependencies]
console-types = { path = "crates/console-types" }
console-core = { path = "crates/console-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# QR image decoding for "join by uploading a photo of the invite QR".
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.8"
rfd = "0.15"
dioxus = { version = "0.6.0", features = [] }
# Public Rust SDK from github.com/mesh-llm/mesh-llm, pinned to a release tag
# so the dynamic native-runtime installer finds its matching release assets
# (native-runtimes.json only ships with releases >= v0.72.0-rc1).
mesh-llm-sdk = { git = "https://github.com/mesh-llm/mesh-llm", tag = "v0.72.0-rc1" }
# Bridges the console's owner.hex identity into the keystore format the
# embedded node's --owner-key expects. Same pin as mesh-llm-sdk.
mesh-llm-identity = { git = "https://github.com/mesh-llm/mesh-llm", tag = "v0.72.0-rc1" }
# Real config parser/validator for the TOML Review tab. Same pin.
mesh-llm-config = { git = "https://github.com/mesh-llm/mesh-llm", tag = "v0.72.0-rc1" }
# Direct dep only for initialize_host_runtime(): the embedded entrypoint in
# v0.72.0-rc1 never loads the dynamic native runtime (upstream gap — the CLI
# calls this itself in mesh-llm/src/lib.rs). Already in the graph via the SDK.
mesh-llm-host-runtime = { git = "https://github.com/mesh-llm/mesh-llm", tag = "v0.72.0-rc1" }

# To develop against the sibling checkout instead of the pinned rev, uncomment:
# [patch."https://github.com/mesh-llm/mesh-llm"]
# mesh-llm-sdk = { path = "../mesh-llm/crates/mesh-llm-sdk" }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
